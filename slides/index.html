<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hatex slides</title>
<meta name="description" content="A beamer slide deck rendered in the browser by hatex: frames, blocks, columns, maths, TikZ, code and a full-screen presenter.">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="../lib/hatex.css">
<style>
  :root { color-scheme: light; }
  body {
    margin: 0;
    background: #fff;
    color: #000;
    font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 60rem; margin: 0 auto; padding: 2.5rem 1.25rem 4rem; }
  a { color: #000; }
  .nav { font-size: 0.85rem; margin: 0 0 1.5rem; }
  h1 { font-size: 1.5rem; margin: 0 0 0.3rem; }
  .lead { margin: 0 0 1.5rem; color: #444; }
  .hatex {
    --hx-ink: #111;
    --hx-muted: #666;
    --hx-accent: #111;
    --hx-code-bg: #f4f4f4;
    --hx-border: #ccc;
    --hx-font-heading: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .hatex .hatex-slide { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  footer { margin-top: 2rem; font-size: 0.85rem; text-align: center; }
</style>
</head>
<body>
<main>
  <p class="nav"><a href="../">← hatex demos</a></p>
  <h1>hatex slides</h1>
  <p class="lead">A beamer deck, <a href="slides.tex">slides.tex</a>, rendered in the browser. Press <b>Present</b> for full screen.</p>
  <div id="deck"><noscript>This deck is rendered from <a href="slides.tex">slides.tex</a> by JavaScript.</noscript></div>
  <footer>Typeset in your browser by <a href="../../">hatex</a>.</footer>
</main>

<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
<script src="../lib/hatex.js"></script>
<script>
  fetch('slides.tex')
    .then(r => r.text())
    .then(tex => HaTeX.render('#deck', tex, { tikzSvgBase: 'tikz/', animate: false, zoom: false }));
</script>
</body>
</html>
